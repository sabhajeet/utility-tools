<!DOCTYPE html>
<html>

<head>
<title>Image Compressor</title>
<link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

<h2>Image Compressor</h2>

<div id="dropArea" class="drop-area">
<p>Drag & Drop Image Here</p>
<input type="file" id="imageInput" accept="image/*">
</div>

<label>Compression Quality: <span id="qualityValue">0.7</span></label>
<input type="range" id="quality" min="0.1" max="1" step="0.1" value="0.7">

<label>Resize Width (optional)</label>
<input type="number" id="resizeWidth" placeholder="Leave empty to keep original, like 200">

<button onclick="compressImage()">Compress Image</button>

<div class="result-box">

<p><b>Original Size:</b> <span id="originalSize"></span></p>
<p><b>Compressed Size:</b> <span id="compressedSize"></span></p>
<p><b>Compression:</b> <span id="compressionPercent"></span></p>

</div>

<div class="preview-box">

<div>
<h4>Original</h4>
<img id="originalPreview">
</div>

<div>
<h4>Compressed</h4>
<img id="compressedPreview">
</div>

</div>

<a id="downloadLink" style="display:none;" download="compressed-image.jpg">
<button>Download Image</button>
</a>

</div>

<script src="/js/image-compressor.js"></script>

</body>

</html>
