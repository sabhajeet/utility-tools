<!DOCTYPE html>
<html>

<head>
<title>Text Case Converter</title>
<link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

<h2>Text Case Converter</h2>

<textarea id="inputText" placeholder="Enter your text here"></textarea>

<button onclick="toUpper()">UPPERCASE</button><br><br>
<button onclick="toLower()">lowercase</button><br><br>
<button onclick="toTitle()">Title Case</button><br><br>
<button onclick="toSentence()">Sentence case</button><br><br>

<textarea id="outputText" placeholder="Converted text will appear here" readonly></textarea>

</div>

<script src="/js/text-case.js"></script>

</body>

</html>
