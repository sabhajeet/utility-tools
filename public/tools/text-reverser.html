<!DOCTYPE html>
<html>

<head>
<title>Text Reverser</title>
<link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

<h2>Text Reverser</h2>

<textarea id="inputText" placeholder="Enter text here"></textarea>

<button onclick="reverseText()">Reverse Text</button>
<br><br>
<button onclick="reverseWords()">Reverse Words</button>
<br><br>
<button onclick="reverseLines()">Reverse Lines</button>

<textarea id="outputText" placeholder="Result will appear here" readonly></textarea>

</div>

<script src="/js/text-reverser.js"></script>

</body>

</html>
