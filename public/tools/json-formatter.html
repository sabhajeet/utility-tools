<!DOCTYPE html>
<html>

<head>
<title>JSON Formatter</title>
<link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

<h2>JSON Formatter</h2>

</div>

<script src="/js/json.js"></script>

</body>

</html>
