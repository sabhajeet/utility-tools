<!DOCTYPE html>
<html>

<head>
<title>Password Strength Checker</title>
<link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

<h2>Password Strength Checker</h2>

<input type="text" id="password" placeholder="Enter password" oninput="checkStrength()">

<div class="strength-bar">
<div id="strengthFill"></div>
</div>

<h3 id="strengthText">Strength: </h3>

<ul class="rules">

<li id="length">❌ At least 8 characters</li>
<li id="upper">❌ Uppercase letter</li>
<li id="lower">❌ Lowercase letter</li>
<li id="number">❌ Number</li>
<li id="special">❌ Special character</li>

</ul>

</div>

<script src="/js/password-strength.js"></script>

</body>

</html>
