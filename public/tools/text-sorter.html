<!DOCTYPE html>
<html>

<head>
<title>Text Sorter</title>
<link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

<h2>Text Sorter</h2>

<textarea id="inputText" placeholder="Enter text lines"></textarea>

<button onclick="sortAZ()">Sort A → Z</button><br><br>
<button onclick="sortZA()">Sort Z → A</button><br><br>
<button onclick="sortLength()">Sort by Length</button><br><br>
<button onclick="removeEmpty()">Remove Empty Lines</button><br><br>

<textarea id="outputText" placeholder="Sorted text will appear here" readonly></textarea>

</div>

<script src="/js/text-sorter.js"></script>

</body>

</html>
